<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 랜덤 뽑기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 32px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: 32px;
    }

    .description {
      margin: 0 0 20px;
      text-align: center;
      color: #64748b;
    }

    textarea {
      width: 100%;
      min-height: 220px;
      padding: 16px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #4f46e5;
      color: white;
      font: inherit;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    button:active {
      transform: translateY(1px);
    }

    .result-card {
      display: none;
      margin-top: 24px;
      padding: 24px;
      border: 2px solid #c7d2fe;
      border-radius: 16px;
      background: #eef2ff;
      text-align: center;
    }

    .result-card.show {
      display: block;
    }

    .result-label {
      margin: 0 0 10px;
      color: #6366f1;
      font-size: 15px;
      font-weight: bold;
    }

    #result {
      margin: 0;
      color: #312e81;
      font-size: 28px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .notice {
      color: #dc2626 !important;
      font-size: 18px !important;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>오늘의 랜덤 뽑기</h1>
    <p class="description">선택지를 한 줄에 하나씩 입력해 주세요.</p>

    <textarea
      id="options"
      placeholder="예시:&#10;김치찌개&#10;돈가스&#10;비빔밥"
      aria-label="랜덤 뽑기 선택지"
    ></textarea>

    <button id="drawButton" type="button">랜덤으로 뽑기</button>

    <section id="resultCard" class="result-card" aria-live="polite">
      <p class="result-label">뽑기 결과</p>
      <p id="result"></p>
    </section>
  </main>

  <script>
    const optionsInput = document.getElementById("options");
    const drawButton = document.getElementById("drawButton");
    const resultCard = document.getElementById("resultCard");
    const result = document.getElementById("result");

    drawButton.addEventListener("click", function () {
      // 줄바꿈을 기준으로 나눈 뒤, 빈 줄은 선택지에서 제외합니다.
      const options = optionsInput.value
        .split("\n")
        .map(function (option) {
          return option.trim();
        })
        .filter(function (option) {
          return option !== "";
        });

      resultCard.classList.add("show");

      if (options.length === 0) {
        result.textContent = "선택지를 먼저 입력해주세요";
        result.classList.add("notice");
        return;
      }

      const randomNumber = Math.floor(Math.random() * options.length);
      result.textContent = options[randomNumber];
      result.classList.remove("notice");
    });
  </script>
</body>
</html>
